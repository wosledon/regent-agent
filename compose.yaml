services:
  postgres:
    image: postgres:17-alpine
    profiles: ["postgres"]
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-regent}
      POSTGRES_USER: ${POSTGRES_USER:-regent}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-regent_dev_only}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-regent} -d ${POSTGRES_DB:-regent}"]
      interval: 5s
      timeout: 3s
      retries: 20

  rustfs:
    image: rustfs/rustfs:1.0.0
    profiles: ["rustfs"]
    environment:
      RUSTFS_ACCESS_KEY: ${RUSTFS_ACCESS_KEY:-regent}
      RUSTFS_SECRET_KEY: ${RUSTFS_SECRET_KEY:-regent_dev_only}
      RUSTFS_VOLUMES: /data
    volumes:
      - rustfs-data:/data
    ports:
      - "9000:9000"

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.120.0
    profiles: ["observability"]
    command: ["--config=/etc/otelcol-contrib/config.yaml"]
    volumes:
      - ./deploy/otel-collector.yaml:/etc/otelcol-contrib/config.yaml:ro
    ports:
      - "4317:4317"

  controlplane:
    build:
      context: .
      dockerfile: deploy/Dockerfile.backend
      args:
        PROJECT: RegentAgent.ControlPlane
    command: ["RegentAgent.ControlPlane.dll"]
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_HTTP_PORTS: "8080"
      Storage__Provider: "${Storage__Provider:-Sqlite}"
      Storage__UseInMemory: "false"
      ConnectionStrings__Postgres: "Host=postgres;Port=5432;Database=${POSTGRES_DB:-regent};Username=${POSTGRES_USER:-regent};Password=${POSTGRES_PASSWORD:-regent_dev_only}"
      Storage__ObjectProvider: "${Storage__ObjectProvider:-Local}"
      Storage__S3__ServiceUrl: "${Storage__S3__ServiceUrl:-}"
      Storage__S3__Region: "${Storage__S3__Region:-us-east-1}"
      Storage__S3__Bucket: "${Storage__S3__Bucket:-}"
      Storage__S3__AccessKey: "${Storage__S3__AccessKey:-}"
      Storage__S3__SecretKey: "${Storage__S3__SecretKey:-}"
      Audit__AnchorProvider: "${Audit__AnchorProvider:-Local}"
      Runner__Token: "${Runner__Token:-}"
      Observability__Profile: "${Observability__Profile:-local}"
      Observability__OtlpEndpoint: "${Observability__OtlpEndpoint:-http://otel-collector:4317}"
      AgentIdentity__KeyPath: "/data/secrets/agent-token.key"
      Frontend__Origins__0: "http://localhost:5173"
      Frontend__Origins__1: "http://localhost:4173"
    ports:
      - "5080:8080"
    volumes:
      - agent-identity-data:/data/secrets

  gateway:
    build:
      context: .
      dockerfile: deploy/Dockerfile.backend
      args:
        PROJECT: RegentAgent.Gateway
    command: ["RegentAgent.Gateway.dll"]
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_HTTP_PORTS: "8080"
      Gateway__ProviderMode: "${Gateway__ProviderMode:-local}"
      Gateway__KeyVault__Provider: "${Gateway__KeyVault__Provider:-local}"
      Gateway__KeyVault__ConnectionString: "${Gateway__KeyVault__ConnectionString:-}"
      Observability__Profile: "${Observability__Profile:-local}"
      Observability__OtlpEndpoint: "${Observability__OtlpEndpoint:-http://otel-collector:4317}"
      AgentIdentity__KeyPath: "/data/secrets/agent-token.key"
    ports:
      - "5081:8080"
    volumes:
      - agent-identity-data:/data/secrets
    depends_on:
      - controlplane

  runner:
    build:
      context: .
      dockerfile: deploy/Dockerfile.backend
      args:
        PROJECT: RegentAgent.Runner
    command: ["RegentAgent.Runner.dll"]
    environment:
      ControlPlane__BaseUrl: "http://controlplane:8080"
      Gateway__BaseUrl: "http://gateway:8080"
      Runner__Token: "${Runner__Token:-}"
      Observability__Profile: "${Observability__Profile:-local}"
      Observability__OtlpEndpoint: "${Observability__OtlpEndpoint:-http://otel-collector:4317}"
    depends_on:
      - controlplane
      - gateway

  operations:
    build:
      context: .
      dockerfile: deploy/Dockerfile.backend
      args:
        PROJECT: RegentAgent.Operations
    command: ["RegentAgent.Operations.dll"]
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_HTTP_PORTS: "8080"
      Observability__Profile: "${Observability__Profile:-local}"
      Observability__OtlpEndpoint: "${Observability__OtlpEndpoint:-http://otel-collector:4317}"
    ports:
      - "5082:8080"

  tenant-dashboard:
    build:
      context: .
      dockerfile: deploy/Dockerfile.frontend
      args:
        APP: "@regent/tenant-dashboard"
        HTML_DIR: apps/tenant-dashboard/dist
    ports:
      - "5173:80"
    depends_on:
      - controlplane

  ops-console:
    build:
      context: .
      dockerfile: deploy/Dockerfile.frontend
      args:
        APP: "@regent/ops-console"
        HTML_DIR: apps/ops-console/dist
    ports:
      - "4173:80"
    depends_on:
      - operations

volumes:
  postgres-data:
  rustfs-data:
  agent-identity-data:
